# Sampling configuration for the redundant arm_1 + table_1 system (8 DOF).
#
# urdf must be a FLATTENED urdf (xacro already expanded). The repo ships one at
# workcell_description/urdf/workcell_full.urdf; regenerate after URDF edits with:
#   xacro ros2_ws/src/workcell_description/urdf/workcell.urdf.xacro > \
#       ros2_ws/src/workcell_description/urdf/workcell_full.urdf
urdf: ros2_ws/src/workcell_description/urdf/workcell_full.urdf

ee_frame: t1_a1_tool_frame

# The 8 actuated DOF that make up the redundant system. All other joints in the
# full workcell are auto-locked at their neutral value by data_gen.
joints:
  - t1_linear_joint        # table prismatic, 0..3.0 m
  - t1_rotation_joint      # table revolute,  -1.57..1.57 rad
  - t1_a1_joint_1
  - t1_a1_joint_2
  - t1_a1_joint_3
  - t1_a1_joint_4
  - t1_a1_joint_5
  - t1_a1_joint_6

# Travel limits, same order as `joints`. Table from URDF; arm joints are the
# Gen3 Lite ranges (verify against joint_limits.yaml / URDF before a real run).
lower: [0.0,  -1.57, -2.68, -2.61, -2.61, -2.60, -2.53, -2.60]
upper: [3.0,   1.57,  2.68,  2.61,  2.61,  2.60,  2.53,  2.60]
