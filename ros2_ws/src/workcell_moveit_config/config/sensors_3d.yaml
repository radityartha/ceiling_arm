# --- GLOBAL SETTINGS ---
octomap_frame: world
octomap_resolution: 0.02 # 2 cm voxels: finer, follows the sensed shape more
# closely (was 0.03 for lightness). If move_group/RViz get sluggish, revert to 0.03.
max_range: 5.0

sensors:
  - default_sensor
  - kinect_depthimage
  - rgbd_scene
  - rgbd2_scene
default_sensor:
  far_clipping_plane_distance: 5.0
  filtered_cloud_topic: filtered_cloud
  image_topic: /head_mount_kinect/depth_registered/image_raw
  max_update_rate: 1.0
  near_clipping_plane_distance: 0.3
  padding_offset: 0.03
  padding_scale: 4.0
  queue_size: 5
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.2
kinect_depthimage:
  far_clipping_plane_distance: 5.0
  filtered_cloud_topic: filtered_cloud
  image_topic: /head_mount_kinect/depth_registered/image_raw
  max_update_rate: 1.0
  near_clipping_plane_distance: 0.3
  padding_offset: 0.03
  padding_scale: 4.0
  queue_size: 5
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.2
# --- ISAAC RGBD CAMERAS (sim / GNG workflow) ---
# collision_cloud publishes the FULL depth reading (whole scene: work table,
# fixtures and objects) per camera in the optical frame; these updaters voxelize
# both into the planning-scene octomap so MoveIt avoids the whole environment.
# The robot's own links in view are self-filtered by the updater (padding below).
# In the real-hardware workflow these topics simply have no publisher (idle).
rgbd_scene:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /rgbd/collision_cloud
  max_range: 8.0
  point_subsample: 1
  max_update_rate: 20.0   # ingest more frames so the surface fills faster/denser
  # aggressive self-filter so the arms (which hang into the camera view) are
  # removed before octomap insertion -- otherwise the arm bakes in as a stale
  # obstacle. Pairs with the periodic /clear_octomap refresher.
  padding_offset: 0.05
  padding_scale: 1.3
  filtered_cloud_topic: rgbd_filtered_cloud

rgbd2_scene:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /rgbd2/collision_cloud
  max_range: 8.0
  point_subsample: 1
  max_update_rate: 20.0   # ingest more frames so the surface fills faster/denser
  # aggressive self-filter so the arms (which hang into the camera view) are
  # removed before octomap insertion -- otherwise the arm bakes in as a stale
  # obstacle. Pairs with the periodic /clear_octomap refresher.
  padding_offset: 0.05
  padding_scale: 1.3
  filtered_cloud_topic: rgbd2_filtered_cloud
