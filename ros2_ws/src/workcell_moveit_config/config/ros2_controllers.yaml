# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_1_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm_2_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm_3_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    arm_4_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    table_1_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    table_2_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_1_controller:
      type: position_controllers/GripperActionController


    gripper_2_controller:
      type: position_controllers/GripperActionController


    gripper_3_controller:
      type: position_controllers/GripperActionController


    gripper_4_controller:
      type: position_controllers/GripperActionController


    table_1_with_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    table_2_with_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    # Cartesian-velocity controller for arm_1, used only for the compliant
    # curtain pull. Loaded inactive; claims t1_a1_tcp twist interfaces.
    t1_a1_twist_controller:
      type: picknik_twist_controller/PicknikTwistController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_1_controller:
  ros__parameters:
    joints:
      - t1_a1_joint_1
      - t1_a1_joint_2
      - t1_a1_joint_3
      - t1_a1_joint_4
      - t1_a1_joint_5
      - t1_a1_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
arm_2_controller:
  ros__parameters:
    joints:
      - t1_a2_joint_1
      - t1_a2_joint_2
      - t1_a2_joint_3
      - t1_a2_joint_4
      - t1_a2_joint_5
      - t1_a2_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
arm_3_controller:
  ros__parameters:
    joints:
      - t2_a1_joint_1
      - t2_a1_joint_2
      - t2_a1_joint_3
      - t2_a1_joint_4
      - t2_a1_joint_5
      - t2_a1_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
arm_4_controller:
  ros__parameters:
    joints:
      - t2_a2_joint_1
      - t2_a2_joint_2
      - t2_a2_joint_3
      - t2_a2_joint_4
      - t2_a2_joint_5
      - t2_a2_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
table_1_controller:
  ros__parameters:
    joints:
      - t1_linear_joint
      - t1_rotation_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
table_2_controller:
  ros__parameters:
    joints:
      - t2_linear_joint
      - t2_rotation_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
gripper_1_controller:
  ros__parameters:
    joint: t1_a1_right_finger_bottom_joint
gripper_2_controller:
  ros__parameters:
    joint: t1_a2_right_finger_bottom_joint
gripper_3_controller:
  ros__parameters:
    joint: t2_a1_right_finger_bottom_joint
gripper_4_controller:
  ros__parameters:
    joint: t2_a2_right_finger_bottom_joint
table_1_with_arm_controller:
  ros__parameters:
    joints:
      - t1_linear_joint
      - t1_rotation_joint
      - t1_a1_joint_1
      - t1_a1_joint_2
      - t1_a1_joint_3
      - t1_a1_joint_4
      - t1_a1_joint_5
      - t1_a1_joint_6
      - t1_a2_joint_1
      - t1_a2_joint_2
      - t1_a2_joint_3
      - t1_a2_joint_4
      - t1_a2_joint_5
      - t1_a2_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
t1_a1_twist_controller:
  ros__parameters:
    # "joint" is the prefixed tcp interface name exported by the patched Kortex
    # driver (joints_prefix_ + "tcp"); the controller claims t1_a1_tcp/twist.*.
    joint: t1_a1_tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z
table_2_with_arm_controller:
  ros__parameters:
    joints:
      - t2_linear_joint
      - t2_rotation_joint
      - t2_a1_joint_1
      - t2_a1_joint_2
      - t2_a1_joint_3
      - t2_a1_joint_4
      - t2_a1_joint_5
      - t2_a1_joint_6
      - t2_a2_joint_1
      - t2_a2_joint_2
      - t2_a2_joint_3
      - t2_a2_joint_4
      - t2_a2_joint_5
      - t2_a2_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity