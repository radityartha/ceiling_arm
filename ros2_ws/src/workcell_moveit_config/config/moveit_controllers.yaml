# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - table_1_with_arm_controller
    - table_2_with_arm_controller
    - gripper_1_controller
    - gripper_2_controller
    - gripper_3_controller
    - gripper_4_controller

  table_1_with_arm_controller:
    type: FollowJointTrajectory
    joints:
      - t1_linear_joint
      - t1_rotation_joint
      - t1_a1_joint_1
      - t1_a1_joint_2
      - t1_a1_joint_3
      - t1_a1_joint_4
      - t1_a1_joint_5
      - t1_a1_joint_6
      - t1_a2_joint_1
      - t1_a2_joint_2
      - t1_a2_joint_3
      - t1_a2_joint_4
      - t1_a2_joint_5
      - t1_a2_joint_6
    action_ns: follow_joint_trajectory
    default: true
  table_2_with_arm_controller:
    type: FollowJointTrajectory
    joints:
      - t2_linear_joint
      - t2_rotation_joint
      - t2_a1_joint_1
      - t2_a1_joint_2
      - t2_a1_joint_3
      - t2_a1_joint_4
      - t2_a1_joint_5
      - t2_a1_joint_6
      - t2_a2_joint_1
      - t2_a2_joint_2
      - t2_a2_joint_3
      - t2_a2_joint_4
      - t2_a2_joint_5
      - t2_a2_joint_6
    action_ns: follow_joint_trajectory
    default: true
  gripper_1_controller:
    type: GripperCommand
    joints:
      - t1_a1_right_finger_bottom_joint
    action_ns: gripper_cmd
    default: true
  gripper_2_controller:
    type: GripperCommand
    joints:
      - t1_a2_right_finger_bottom_joint
    action_ns: gripper_cmd
    default: true
  gripper_3_controller:
    type: GripperCommand
    joints:
      - t2_a1_right_finger_bottom_joint
    action_ns: gripper_cmd
    default: true
  gripper_4_controller:
    type: GripperCommand
    joints:
      - t2_a2_right_finger_bottom_joint
    action_ns: gripper_cmd
    default: true