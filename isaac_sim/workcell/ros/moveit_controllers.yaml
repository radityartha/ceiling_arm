# MoveIt execution controllers for the Isaac Sim workcell: per-arm + per-gripper
# (like moveit_controllers_per_arm.yaml) PLUS the two table controllers, which are
# valid in sim (the sim_isaac topic_based table system exposes position+velocity
# state, so the JointTrajectoryController activates).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_1_controller
    - arm_2_controller
    - arm_3_controller
    - arm_4_controller
    - gripper_1_controller
    - gripper_2_controller
    - gripper_3_controller
    - gripper_4_controller
    - gantry_1_controller
    - gantry_2_controller

  arm_1_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t1_a1_joint_1, t1_a1_joint_2, t1_a1_joint_3, t1_a1_joint_4, t1_a1_joint_5, t1_a1_joint_6] }
  arm_2_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t1_a2_joint_1, t1_a2_joint_2, t1_a2_joint_3, t1_a2_joint_4, t1_a2_joint_5, t1_a2_joint_6] }
  arm_3_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t2_a1_joint_1, t2_a1_joint_2, t2_a1_joint_3, t2_a1_joint_4, t2_a1_joint_5, t2_a1_joint_6] }
  arm_4_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t2_a2_joint_1, t2_a2_joint_2, t2_a2_joint_3, t2_a2_joint_4, t2_a2_joint_5, t2_a2_joint_6] }

  gripper_1_controller: { type: GripperCommand, action_ns: gripper_cmd, default: true, joints: [t1_a1_right_finger_bottom_joint] }
  gripper_2_controller: { type: GripperCommand, action_ns: gripper_cmd, default: true, joints: [t1_a2_right_finger_bottom_joint] }
  gripper_3_controller: { type: GripperCommand, action_ns: gripper_cmd, default: true, joints: [t2_a1_right_finger_bottom_joint] }
  gripper_4_controller: { type: GripperCommand, action_ns: gripper_cmd, default: true, joints: [t2_a2_right_finger_bottom_joint] }

  gantry_1_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t1_linear_joint, t1_rotation_joint] }
  gantry_2_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t2_linear_joint, t2_rotation_joint] }
