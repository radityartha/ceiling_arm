# MoveIt execution controllers for the TABLE_1-ONLY Isaac GNG view.
# Only the controllers whose joints exist in table1_isaac.urdf (table_1 + arm_1
# + arm_2 + grippers 1/2). Planning table_1_with_arm_1/_2 (8 DOF) executes split
# across arm_N_controller + table_1_controller.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_1_controller
    - arm_2_controller
    - gripper_1_controller
    - gripper_2_controller
    - table_1_controller

  arm_1_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t1_a1_joint_1, t1_a1_joint_2, t1_a1_joint_3, t1_a1_joint_4, t1_a1_joint_5, t1_a1_joint_6] }
  arm_2_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t1_a2_joint_1, t1_a2_joint_2, t1_a2_joint_3, t1_a2_joint_4, t1_a2_joint_5, t1_a2_joint_6] }
  gripper_1_controller: { type: GripperCommand, action_ns: gripper_cmd, default: true, joints: [t1_a1_right_finger_bottom_joint] }
  gripper_2_controller: { type: GripperCommand, action_ns: gripper_cmd, default: true, joints: [t1_a2_right_finger_bottom_joint] }
  table_1_controller: { type: FollowJointTrajectory, action_ns: follow_joint_trajectory, default: true,
    joints: [t1_linear_joint, t1_rotation_joint] }
